name: Deploy Peyja to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Copy benchmark data
        run: |
          mkdir -p tehran_beauty_instagram_benchmark
          # In GitHub CI we expect the data to live in public/data already committed.
          # If benchmark dir is absent, skip data build and use committed JSON.
          if [ -f ../tehran_beauty_instagram_benchmark/deliverables/golden_dataset_62_final.xlsx ]; then
            cp -r ../tehran_beauty_instagram_benchmark tehran_beauty_instagram_benchmark
            npm run data:build
          else
            echo "Benchmark data not present; using committed public/data/products.json"
          fi

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
